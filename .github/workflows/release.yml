name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Extract changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes=$(awk -v version="$version" '$1 == "##" {if (found) exit; found = ($2 == "[" version "]"); next} found {print}' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "No changelog entry for $version" >&2
            exit 1
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/mixtape-release-notes.txt"

      - name: Publish crates to crates.io
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/publish_crates.py "$RELEASE_VERSION"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create or update GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/mixtape-release-notes.txt"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/mixtape-release-notes.txt"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
